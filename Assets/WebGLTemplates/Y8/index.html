<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./style.css">

    <!-- Y8 SDK -->
    <script src='https://cdn.y8.com/api/sdk.js' async></script>

    <!-- Y8 Configuration -->
    <script>
        window.enableSDK = __Y8_ENABLE_SDK__;
        window.Y8_APP_ID = "YOUR_Y8_APP_ID";
        window.y8SdkReady = false;
        window.y8CurrentAdType = null;
        window.y8InterstitialCallbacks = null;
        window.y8RewardedCallbacks = null;

        // Y8 SDK инициализация
        window.idAsyncInit = function () {
            if (!window.enableSDK) return;
            console.log("[Y8_HTML] SDK script loaded, initializing...");

            ID.init({
                appId: window.Y8_APP_ID
            });

            ID.Event.subscribe('id.init', function() {
                console.log("[Y8_HTML] Y8 SDK initialized successfully");
                window.y8SdkReady = true;
                YG2Instance('Y8SDKReady');
            });

            ID.Event.subscribe('auth.authResponseChange', function(auth) {
                console.log("[Y8_HTML] Auth state changed:", auth);
            });
        };

        // Y8 GameBreak Ad System
        (function () {
            if (!window.enableSDK) return;
            console.log('[Y8_HTML] Initializing Y8 GameBreak ad system...');

            var imported = document.createElement('script');
            var HostId = 'ca-host-pub-6129580795478709';
            var AdsenseId = 'ca-pub-6129580795478709';
            var ChannelId = '123456';
            var adFrequency = '180s';
            var testAdsOn = true;
            var activateAFP = false;

            window.adsbygoogle = window.adsbygoogle || [];
            const adBreak = adConfig = function(o) {adsbygoogle.push(o);}
            adConfig({
                preloadAdBreaks: 'on',
                sound: 'on',
                onReady: () => {
                    console.log('[Y8_HTML] Ad system ready');
                },
            });

            function nextAds()
            {
                if (!window.enableSDK) return;
                console.log('[Y8_HTML] showNextAd');
                adBreak({
                    type: 'start',
                    name: 'start-game',
                    beforeAd: () => {
                        console.log('[Y8_HTML] Interstitial ad opened');
                        window.pauseGame();

                        // Вызов колбэка открытия
                        if (window.y8CurrentAdType === 'interstitial' && window.y8InterstitialCallbacks) {
                            window.y8InterstitialCallbacks.open();
                        }
                    },
                    afterAd: () => {
                        console.log('[Y8_HTML] Interstitial ad closed');
                        window.resumeGame();

                        // Вызов колбэка закрытия
                        if (window.y8CurrentAdType === 'interstitial' && window.y8InterstitialCallbacks) {
                            window.y8InterstitialCallbacks.close();
                            window.y8InterstitialCallbacks = null;
                            window.y8CurrentAdType = null;
                        }
                    },
                    adBreakDone: (placementInfo) => {
                        console.log('[Y8_HTML] Interstitial ad break complete');
                        console.log('Status:', placementInfo.breakStatus);

                        // Обработка ошибок
                        if ((placementInfo.breakStatus === 'frequencyCapped' || placementInfo.breakStatus === 'other') &&
                            window.y8CurrentAdType === 'interstitial' && window.y8InterstitialCallbacks) {
                            console.error('[Y8_HTML] Interstitial ad error');
                            window.y8InterstitialCallbacks.error();
                            window.y8InterstitialCallbacks = null;
                            window.y8CurrentAdType = null;
                        }
                    },
                });
            }

            function showReward()
            {
                if (!window.enableSDK) return;
                console.log('[Y8_HTML] showReward');
                adBreak({
                    type: 'reward',
                    name: 'rewarded Ad',
                    beforeAd: () => {
                        console.log('[Y8_HTML] Rewarded ad opened');
                        window.pauseGame();

                        // Вызов колбэка открытия
                        if (window.y8CurrentAdType === 'rewarded' && window.y8RewardedCallbacks) {
                            window.y8RewardedCallbacks.open();
                        }
                    },
                    afterAd: () => {
                        console.log('[Y8_HTML] Rewarded ad closed');
                        window.resumeGame();

                        // Вызов колбэка закрытия
                        if (window.y8CurrentAdType === 'rewarded' && window.y8RewardedCallbacks) {
                            window.y8RewardedCallbacks.close();
                            window.y8RewardedCallbacks = null;
                            window.y8CurrentAdType = null;
                        }
                    },
                    beforeReward: (showAdFn) => {
                        console.log('[Y8_HTML] beforeReward');
                        showAdFn(0);
                    },
                    adDismissed: () => {
                        console.log('[Y8_HTML] Rewarded ad dismissed');
                        if (window.y8CurrentAdType === 'rewarded' && window.y8RewardedCallbacks) {
                            window.y8RewardedCallbacks.close();
                            window.y8RewardedCallbacks = null;
                            window.y8CurrentAdType = null;
                        }
                    },
                    adViewed: () => {
                        console.log('[Y8_HTML] Rewarded ad completed');
                        if (window.y8CurrentAdType === 'rewarded' && window.y8RewardedCallbacks) {
                            window.y8RewardedCallbacks.rewarded();
                        }
                    },
                    adBreakDone: (placementInfo) => {
                        console.log('[Y8_HTML] Rewarded ad break complete');
                        console.log('Status:', placementInfo.breakStatus);

                        // Обработка ошибок
                        if ((placementInfo.breakStatus === 'frequencyCapped' || placementInfo.breakStatus === 'other') &&
                            window.y8CurrentAdType === 'rewarded' && window.y8RewardedCallbacks) {
                            console.error('[Y8_HTML] Rewarded ad error');
                            window.y8RewardedCallbacks.error();
                            window.y8RewardedCallbacks = null;
                            window.y8CurrentAdType = null;
                        }
                    },
                });
            }

            // Глобальные функции для паузы/возобновления игры
            window.pauseGame = function() {
                console.log('[Y8_HTML] Pausing game');
                YG2Instance('SetPauseGame', 'true');
            }

            window.resumeGame = function() {
                console.log('[Y8_HTML] Resuming game');
                YG2Instance('SetPauseGame', 'false');
            }

            function createAFGScript() {
                if (!window.enableSDK) return;
                console.log('[Y8_HTML] createAFGScript');

                if(activateAFP == true){ imported.setAttribute('data-ad-host', HostId); }
                imported.setAttribute('data-ad-client', AdsenseId);
                if(activateAFP == false){ imported.setAttribute('data-ad-channel', ChannelId); }
                imported.setAttribute('data-ad-frequency-hint', adFrequency);
                if(testAdsOn == true){ imported.setAttribute('data-adbreak-test', 'on'); }
                imported.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';
                imported.setAttribute('type', 'text/javascript');
                imported.async = true;
                imported.onload = function() {
                    console.log('[Y8_HTML] Ad script loaded successfully');
                };
                imported.onerror = function(error) {
                    console.error('[Y8_HTML] Failed to load ad script:', error);
                };
                document.head.appendChild(imported);
            }

            // Экспортируем функции для глобального доступа
            window.nextAds = nextAds;
            window.showReward = showReward;

            // Инициализируем рекламную систему
            createAFGScript();

            console.log('[Y8_HTML] Y8 GameBreak ad system initialized');
        })();
    </script>

    <style>
        canvas:focus {
            outline: none;
        }

        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            height: 100%;
        }
    </style>

    <!-- Additional head modules -->

</head>
<body class="{{{ SPLASH_SCREEN_STYLE.toLowerCase() }}}">

<div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>
<div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
        <div id="unity-logo"><img src="Images/logo.png"></div>
        <div id="unity-progress-bar-empty" style="display: none;">
            <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
    </div>
</div>

<!-- Additional body modules -->

<script>
    const hideFullScreenButton = "";
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    const config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        #if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
        #endif
        #if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
        #endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}"
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    const canFullscreen = (function () {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
        ]) {
            if (key in document) {
                return true;
            }
        }
        return false;
    }());

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        //config.devicePixelRatio = 1;
    }

    // The background image when loading the game. When building a build, the code changes depending on the project settings.
    #if BACKGROUND_FILENAME
    var backgroundUnity = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
    #endif
    loadingCover.style.background = "url('Images/background.png') center / cover";
    loadingCover.style.display = "";

    let StartUnityInstance;
    let ygGameInstance = null;
    let initGame = false;
    let isVisibility = true;
    let isPausedGame = false;

    // Prevent unwanted page scrolling
    window.addEventListener("keydown", (event) => {
        if (["ArrowUp", "ArrowDown", " "].includes(event.key)) {
            event.preventDefault();
        }
    });
    window.addEventListener("wheel", (event) => event.preventDefault(), {
        passive: false,
    });

    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('visibilitychange', () => SetVisibility(!document.hidden));
    window.addEventListener('blur', () => SetVisibility(false));
    window.addEventListener('focus', () => SetVisibility(true));

    window.addEventListener('pointerdown', () => {
        FocusGame();
        SetVisibility(true);
    });

    function InstallBlurFocusBlocker() {
        if (!('onblur' in document)) return;
        if (window.blurFocusHandlersInstalled) return;

        window.addEventListener('blur', function () {
            let blockerButton = document.createElement('button');
            blockerButton.style.position = 'fixed';
            blockerButton.style.top = '0';
            blockerButton.style.left = '0';
            blockerButton.style.width = '100%';
            blockerButton.style.height = '100%';
            blockerButton.style.zIndex = '9999';
            blockerButton.style.backgroundColor = 'rgba(0, 0, 0, 0)';
            blockerButton.style.border = 'none';
            blockerButton.style.cursor = 'default';

            document.body.appendChild(blockerButton);

            function removeBlocker() {
                if (blockerButton && blockerButton.parentNode) {
                    blockerButton.parentNode.removeChild(blockerButton);
                }
                window.removeEventListener('focus', removeBlocker);
            }

            window.addEventListener('focus', removeBlocker);
        });

        window.blurFocusHandlersInstalled = true;
    }

    function FocusGame() {
        canvas.focus();
    }

    function SetVisibility(visibility) {
        if (initGame === true && isVisibility !== visibility) {
            isVisibility = visibility;
            if (!visibility) {
                YG2Instance('SetFocusWindowGame', 'false');
                if (!isPausedGame) {
                    isPausedGame = true;
                    YG2Instance('SetPauseGame', 'true');
                }
            }
            else {
                YG2Instance('SetFocusWindowGame', 'true');
                if (isPausedGame) {
                    isPausedGame = false;
                    YG2Instance('SetPauseGame', 'false');
                }
            }
        }
    }

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
        StartUnityInstance = function () {
            createUnityInstance(canvas, config, (progress) => {
                spinner.style.display = "none";
                progressBarEmpty.style.display = "";
                const adjustedProgress = Math.max(progress, 0.05);
                progressBarFull.style.width = `${100 * adjustedProgress}%`;
            }).then((unityInstance) => {
                ygGameInstance = unityInstance;
                loadingCover.style.background = "";
                loadingCover.style.display = "none";
                // Fill Background [Build Modify]
            }).catch((message) => {
                console.error(message);
            });
        };

        InstallBlurFocusBlocker();

        // Для Y8 загружаем Unity сразу без ожидания инициализации SDK
        StartUnityInstance_IfUnloaded();
    };

    function StartUnityInstance_IfUnloaded() {
        if (spinner.style.display !== "none")
            StartUnityInstance();
    }

    function IsLocalHost() {
        try {
            if (window.top !== window) {
                return false;
            }

            const host = window.location.hostname;
            if (host === "localhost" || host === "127.0.0.1" || host.endsWith(".local")) {
                LogStyledMessage("Local Host");
                return true;
            }
        }
        catch (error) {
            console.error("Error checking the local host:", error);
            return false;
        }
    }

    function YG2Instance(method) {
        if (ygGameInstance == null)
            return;

        if (!initGame) {
            setTimeout(function () {
                if (ygGameInstance)
                    ygGameInstance.SendMessage('YG2Instance', method);
            }, 100);
        }
        else {
            ygGameInstance.SendMessage('YG2Instance', method);
        }

    }
    function YG2Instance(method, arg) {
        if (ygGameInstance == null)
            return;

        if (!initGame) {
            setTimeout(function () {
                ygGameInstance.SendMessage('YG2Instance', method, arg);
            }, 100);
        }
        else {
            ygGameInstance.SendMessage('YG2Instance', method, arg);
        }
    }

    function LogStyledMessage(message, style) {
        console.log('%c' + message, style);
    }
    function LogStyledMessage(message) {
        console.log('%c' + message, 'color: #FFDF73; background-color: #454545');
    }

    function InitGame() {
        initGame = true;

        setTimeout(function () {
            if (isPausedGame == true)
                YG2Instance('SetPauseGame', 'true');
        }, 100);

        // Additional start modules
    }

    // Additional script modules

    document.body.appendChild(script);
</script>
</body>
</html>
