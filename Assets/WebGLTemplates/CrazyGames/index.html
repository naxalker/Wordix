<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: {{{ BACKGROUND_COLOR }}};
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: {{{ BACKGROUND_COLOR }}};
        }

        #unity-canvas:focus {
            outline: none;
        }

        #loading-bar {
            position: absolute;
            left: 30%;
            top: 50%;
            width: 40%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
        }

        #loading-bar-fill {
            width: 0%;
            height: 100%;
            border-radius: 3px;
            background: #ffffff;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading-bar"><div id="loading-bar-fill"></div></div>

    <script>
        const canvas = document.querySelector("#unity-canvas");
        const loadingBar = document.querySelector("#loading-bar");
        const loadingBarFill = document.querySelector("#loading-bar-fill");

        document.addEventListener("contextmenu", event => event.preventDefault());
        window.addEventListener("pointerdown", () => canvas.focus());

        const config = {
#if PROGRESSIVE_ASSET_LOADING
            primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
            secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
            dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
            frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
            memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
            streamingAssetsUrl: "StreamingAssets",
            companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
            productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
            productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        };

        const script = document.createElement("script");
        script.src = "Build/{{{ LOADER_FILENAME }}}";
        script.onload = () => {
            createUnityInstance(canvas, config, progress => {
                loadingBarFill.style.width = `${100 * progress}%`;
            }).then(() => {
                loadingBar.remove();
                canvas.focus();
            }).catch(message => console.error(message));
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
